  <rect x="32" y="291" width="218" height="56" rx="12" fill="#484b53"/>
  <g transform="translate(44 306)" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M0 20h24M2 20v-5M22 20v-5M2 15h20M5 15c0-7 3-11 9-11s9 4 9 11M8 15V7M17 15V7M0 24h24"/></g>
